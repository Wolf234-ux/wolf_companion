<html lang="en">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://www.gstatic.com https://cdn.jsdelivr.net https://www.google.com https://accounts.google.com https://esm.sh;
  style-src 'self' 'unsafe-inline';
  connect-src 'self' https: wss:;
  img-src 'self' data: https:;
  worker-src 'self' blob:;
  frame-src https://wolf-companion.firebaseapp.com https://accounts.google.com https://www.google.com;
">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Roboto, sans-serif;
    background: #0d0f14;
    color: #eee;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #root { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Auth screen ---------- */
  #authScreen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px calc(env(safe-area-inset-right,0px) + 24px) 24px calc(env(safe-area-inset-left,0px) + 24px);
    gap: 14px;
  }
  #authTitle { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  #authSubtitle { font-size: 13.5px; color: #7d8290; margin-bottom: 10px; }
  #authScreen input {
    padding: 13px 15px;
    border-radius: 12px;
    border: 1px solid #2a2d36;
    background: #1c1f27;
    color: white;
    font-size: 15.5px;
    width: 100%;
  }
  #authScreen input:focus { outline: 2px solid #3b6fed44; }
  #authError { font-size: 13px; min-height: 16px; }
  #authSubmit {
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: #3b6fed;
    color: white;
    font-weight: 600;
    font-size: 15.5px;
    width: 100%;
  }
  #authSubmit:disabled { background: #2a2d36; }
  #authToggle { text-align: center; color: #7d8290; font-size: 13.5px; margin-top: 6px; }
  #authToggle span { color: #6d94ff; }
  #forgotPassword { text-align: center; color: #6d94ff; font-size: 13px; margin-top: -4px; }
  #orDivider { text-align: center; color: #4a4e59; font-size: 12px; margin: 2px 0; }
  #googleBtnHost { display: flex; justify-content: center; min-height: 44px; }
  #tosNote { text-align: center; color: #4a4e59; font-size: 11px; margin-top: 4px; }
  #tosNote a { color: #6d94ff; text-decoration: none; }

  /* ---------- Chat screen ---------- */
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #header {
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
    background: #14161c;
    border-bottom: 1px solid #23262e;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  #headerTitle { font-weight: 700; font-size: 17px; }
  #status { font-size: 12.5px; color: #7d8290; margin-top: 6px; }
  #syncWarning { font-size: 11.5px; color: #f0ad4e; margin-top: 3px; }
  #headerBtns { display: flex; gap: 6px; flex-shrink: 0; }
  #signOutBtn, #accountBtn {
    background: none; border: 1px solid #2a2d36; color: #9aa0ac;
    border-radius: 8px; padding: 6px 10px; font-size: 12px;
  }
  #loadBar { height: 4px; background: #23262e; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  #loadFill { height: 100%; background: #3b6fed; transition: width 0.2s; }
  #retryBtn {
    margin-top: 8px; padding: 8px 14px; border-radius: 10px; border: none;
    background: #3b6fed; color: white; font-weight: 600; font-size: 13px;
  }
  #chat {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 82%; padding: 11px 15px; border-radius: 16px;
    line-height: 1.45; white-space: pre-wrap; font-size: 15.5px; word-wrap: break-word;
  }
  .user { align-self: flex-end; background: #3b6fed; color: white; border-bottom-right-radius: 5px; }
  .bot { align-self: flex-start; background: #1e222b; border-bottom-left-radius: 5px; }
  .sys { align-self: center; color: #7d8290; font-size: 13px; text-align: center; max-width: 90%; }
  #inputBar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    background: #14161c; border-top: 1px solid #23262e; flex-shrink: 0;
  }
  #userInput {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: none;
    background: #1c1f27; color: white; font-size: 15.5px; resize: none;
    max-height: 100px; font-family: inherit;
  }
  #userInput:disabled { opacity: 0.5; }
  #sendBtn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #3b6fed; color: white; font-size: 18px; flex-shrink: 0;
  }
  #sendBtn:disabled { background: #2a2d36; }

  /* ---------- Account modal ---------- */
  #accountModal {
    position: fixed; inset: 0; background: #000000aa;
    display: flex; align-items: flex-end; z-index: 50;
  }
  #accountSheet {
    background: #14161c; width: 100%; border-radius: 18px 18px 0 0;
    padding: 20px calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 20px);
    display: flex; flex-direction: column; gap: 12px;
  }
  #accountSheet h3 { margin: 0 0 4px; font-size: 17px; }
  #accountSheet p { margin: 0; font-size: 13px; color: #9aa0ac; line-height: 1.5; }
  .sheetBtn {
    padding: 13px; border-radius: 12px; border: 1px solid #2a2d36;
    background: #1c1f27; color: white; font-size: 14.5px; font-weight: 600;
  }
  #deleteAccountBtn { border-color: #7f1d1d; color: #f87171; }
  #closeSheetBtn { background: none; border: none; color: #7d8290; font-size: 13px; padding: 6px; }
</style>
</head>
<body>
  <div id="root"></div>

<script type="module">
// ---------------------------------------------------------------------
// Buildless React: no bundler, no JSX (JSX needs a Babel transpile step
// which adds real cost for no functional benefit here) -- everything is
// React.createElement calls, aliased to `h`. React/ReactDOM and Firebase
// are all loaded as genuine ES modules, so this stays a single file with
// zero build step, matching the existing phone-only push workflow.
//
// Design choice: the heavy imperative bits (the wllama model instance,
// streaming tokens, the raw conversation array) live in refs, not state --
// re-rendering React on every streamed token would be wasteful and those
// values need to be read synchronously inside async callbacks anyway.
// React state/hooks drive only what actually needs to trigger a re-render
// (screen, messages snapshot, status text, etc). This is the sensible
// buildless-React shape for an app this size, not a full Redux-style
// rewrite -- that would be over-engineering for two screens.
// ---------------------------------------------------------------------
import React from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, sendPasswordResetEmail,
  GoogleAuthProvider, signInWithCredential,
  deleteUser, reauthenticateWithCredential, EmailAuthProvider
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  doc, getDoc, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { Wllama } from "https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/index.js";

// ---------- Config ----------
const firebaseConfig = {
  apiKey: "AIzaSyASBWzq-pAXUD9MZWM-HCMOX28yVNK3IC4",
  authDomain: "wolf-companion.firebaseapp.com",
  projectId: "wolf-companion",
  storageBucket: "wolf-companion.firebasestorage.app",
  messagingSenderId: "66839823232",
  appId: "1:66839823232:web:73ac4e0ad55e1cbfb27765",
  measurementId: "G-HPCKG2CMSK"
};

// TODO: replace with the real value from Firebase Console -> Authentication
// -> Sign-in method -> Google -> Web SDK configuration -> "Web client ID".
// Google Sign-In will not work until this is a real client ID.
const GOOGLE_CLIENT_ID = "REPLACE_WITH_WEB_CLIENT_ID.apps.googleusercontent.com";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
});

const MODEL_URL = "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf";
const CONFIG_PATHS = {
  'single-thread/wllama.wasm': "https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/single-thread/wllama.wasm",
  'multi-thread/wllama.wasm': "https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/multi-thread/wllama.wasm",
};
const SYSTEM_PROMPT = "You are a warm, witty, emotionally supportive companion. Talk like a real friend - casual, caring, a bit playful. Keep responses conversational length, not essays.";

const KEEP_RAW_MESSAGES = 40;
const CONTEXT_SEND_MESSAGES = 12;
const SUMMARIZE_TRIGGER = 40;
const PROFILE_MAX_CHARS = 1500;
const MAX_INPUT_CHARS = 4000;
const MIN_SEND_INTERVAL_MS = 700;
const MODEL_LOAD_MAX_ATTEMPTS = 3;

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function friendlyAuthError(code) {
  const map = {
    'auth/email-already-in-use': 'That email is already registered. Try signing in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': "We couldn't find an account with that email.",
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
    'auth/requires-recent-login': 'For security, please sign in again to confirm this.',
    'auth/network-request-failed': 'Network error. Check your connection and try again.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

function App() {
  const wllamaRef = useRef(null);
  const historyRef = useRef([{ role: 'system', content: SYSTEM_PROMPT }]);
  const profileRef = useRef('');
  const userRef = useRef(null);
  const modelReadyRef = useRef(false);
  const lastSendTsRef = useRef(0);
  const chatScrollRef = useRef(null);
  const googleBtnHostRef = useRef(null);
  const gisReadyRef = useRef(false);

  const [screen, setScreen] = useState('auth'); // 'auth' | 'chat'
  const [isSignUpMode, setIsSignUpMode] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [authError, setAuthError] = useState('');
  const [authErrorOk, setAuthErrorOk] = useState(false); // green "success" style (password reset email sent)
  const [authBusy, setAuthBusy] = useState(false);

  const [statusText, setStatusText] = useState('Loading model (~1GB, one-time)...');
  const [loadPct, setLoadPct] = useState(0);
  const [loadBarVisible, setLoadBarVisible] = useState(true);
  const [retryVisible, setRetryVisible] = useState(false);
  const [syncWarningVisible, setSyncWarningVisible] = useState(false);
  const [welcomeNotice, setWelcomeNotice] = useState('');

  const [messages, setMessages] = useState([]); // rendered user/assistant snapshot
  const [streamingBotText, setStreamingBotText] = useState(null);
  const [inputValue, setInputValue] = useState('');
  const [sending, setSending] = useState(false);
  const [accountOpen, setAccountOpen] = useState(false);

  function refreshMessagesView() {
    setMessages(historyRef.current.slice(1).map((m, i) => ({ ...m, _k: i })));
  }

  useEffect(() => {
    if (chatScrollRef.current) {
      chatScrollRef.current.scrollTop = chatScrollRef.current.scrollHeight;
    }
  }, [messages, streamingBotText]);

  // ---------- Firestore memory ----------
  async function loadMemory(uid) {
    try {
      const snap = await getDoc(doc(db, 'conversations', uid));
      if (snap.exists()) {
        const data = snap.data();
        if (Array.isArray(data.messages)) {
          historyRef.current = data.messages;
          if (historyRef.current.length === 0 || historyRef.current[0].role !== 'system') {
            historyRef.current.unshift({ role: 'system', content: SYSTEM_PROMPT });
          }
        }
        if (typeof data.profile === 'string') profileRef.current = data.profile;
      }
    } catch (err) {
      console.warn('Could not load memory:', err);
      setSyncWarningVisible(true);
    }
  }

  async function saveMemory(uid, retried) {
    try {
      await setDoc(doc(db, 'conversations', uid), {
        messages: historyRef.current,
        profile: profileRef.current,
        updatedAt: Date.now()
      });
      setSyncWarningVisible(false);
    } catch (err) {
      console.warn('Could not save memory:', err);
      if (!retried) setTimeout(() => saveMemory(uid, true), 1500);
      else setSyncWarningVisible(true);
    }
  }

  // ---------- Bounded memory / rolling summary ----------
  async function maybeSummarizeOldMessages() {
    const nonSystem = historyRef.current.slice(1);
    if (nonSystem.length <= SUMMARIZE_TRIGGER || !wllamaRef.current || !modelReadyRef.current) return;
    const overflow = nonSystem.length - KEEP_RAW_MESSAGES;
    if (overflow <= 0) return;
    const toSummarize = nonSystem.slice(0, overflow);
    const keep = nonSystem.slice(overflow);
    try {
      const transcript = toSummarize.map(m => `${m.role}: ${m.content}`).join('\n').slice(0, 6000);
      const prompt = await wllamaRef.current.formatChat([
        { role: 'system', content: 'Extract lasting facts about the user from this chat excerpt: name, interests, ongoing topics, preferences, important context. Max 5 short bullet points. No chit-chat, no filler.' },
        { role: 'user', content: transcript }
      ], true);
      let summary = '';
      await wllamaRef.current.createCompletion(prompt, {
        nPredict: 150, sampling: { temp: 0.3 },
        onNewToken: (t, p, c) => { summary = c; }
      });
      profileRef.current = (profileRef.current + '\n' + summary.trim()).trim().slice(-PROFILE_MAX_CHARS);
    } catch (err) {
      console.warn('Summary step failed, dropping oldest messages without summarizing:', err);
    }
    historyRef.current = [{ role: 'system', content: SYSTEM_PROMPT }, ...keep];
  }

  function buildContextForModel() {
    const systemContent = profileRef.current
      ? `${SYSTEM_PROMPT}\n\nThings you remember about this person:\n${profileRef.current}`
      : SYSTEM_PROMPT;
    const recent = historyRef.current.slice(1).slice(-CONTEXT_SEND_MESSAGES);
    return [{ role: 'system', content: systemContent }, ...recent];
  }

  // ---------- Model loading ----------
  const initModel = useCallback(async function initModel(attempt = 1) {
    setRetryVisible(false);
    setLoadBarVisible(true);
    try {
      if (!wllamaRef.current) wllamaRef.current = new Wllama(CONFIG_PATHS);
      await wllamaRef.current.loadModelFromUrl(MODEL_URL, {
        progressCallback: (p) => {
          const pct = Math.round((p.loaded / p.total) * 100);
          setLoadPct(pct);
          setStatusText(`Downloading model... ${pct}%`);
        }
      });
      setLoadBarVisible(false);
      modelReadyRef.current = true;
      setStatusText('Ready — your conversations sync to your account.');
      refreshMessagesView();
      if (historyRef.current.length <= 1 && userRef.current) {
        setWelcomeNotice('Model loaded. Signed in as ' + userRef.current.email + '.');
      }
    } catch (err) {
      if (attempt < MODEL_LOAD_MAX_ATTEMPTS) {
        setStatusText(`Load failed, retrying (${attempt}/${MODEL_LOAD_MAX_ATTEMPTS})...`);
        await sleep(1500 * attempt);
        wllamaRef.current = undefined;
        return initModel(attempt + 1);
      }
      setLoadBarVisible(false);
      setStatusText('Failed to load model: ' + err.message);
      setRetryVisible(true);
    }
  }, []);

  // ---------- Auth state ----------
  useEffect(() => {
    const unsub = onAuthStateChanged(auth, async (user) => {
      if (user) {
        userRef.current = user;
        setScreen('chat');
        await loadMemory(user.uid);
        if (!wllamaRef.current) await initModel();
        else refreshMessagesView();
      } else {
        userRef.current = null;
        modelReadyRef.current = false;
        setScreen('auth');
        setAccountOpen(false);
        setEmail('');
        setPassword('');
      }
    });
    return unsub;
  }, [initModel]);

  // ---------- Resume/reconnect resilience ----------
  useEffect(() => {
    function onOnline() {
      if (!modelReadyRef.current && retryVisible) initModel(1);
    }
    function onVisible() {
      if (document.visibilityState === 'visible' && !modelReadyRef.current && retryVisible) initModel(1);
    }
    window.addEventListener('online', onOnline);
    document.addEventListener('visibilitychange', onVisible);
    return () => {
      window.removeEventListener('online', onOnline);
      document.removeEventListener('visibilitychange', onVisible);
    };
  }, [retryVisible, initModel]);

  // ---------- Service worker ----------
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    let reloaded = false;
    const onControllerChange = () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    };
    navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
    return () => navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
  }, []);

  // ---------- Google Identity Services ----------
  const handleGisCredential = useCallback(async (response) => {
    try {
      const credential = GoogleAuthProvider.credential(response.credential);
      await signInWithCredential(auth, credential);
    } catch (err) {
      setAuthErrorOk(false);
      setAuthError(friendlyAuthError(err.code) + (err.code ? ` (${err.code})` : ''));
    }
  }, []);

  useEffect(() => {
    if (screen !== 'auth') return;
    let cancelled = false;

    function setupButton() {
      if (cancelled || !window.google || !googleBtnHostRef.current) return;
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGisCredential,
        auto_select: false,
      });
      googleBtnHostRef.current.innerHTML = '';
      window.google.accounts.id.renderButton(googleBtnHostRef.current, {
        theme: 'filled_black', size: 'large', width: 320, text: 'continue_with', shape: 'pill'
      });
      gisReadyRef.current = true;
    }

    if (window.google && window.google.accounts) {
      setupButton();
    } else if (!document.getElementById('gis-script')) {
      const s = document.createElement('script');
      s.id = 'gis-script';
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.defer = true;
      s.onload = setupButton;
      document.head.appendChild(s);
    } else {
      document.getElementById('gis-script').addEventListener('load', setupButton);
    }
    return () => { cancelled = true; };
  }, [screen, handleGisCredential]);

  function requestGisCredential() {
    return new Promise((resolve, reject) => {
      if (!window.google || !window.google.accounts) return reject({ code: 'auth/internal-error' });
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (resp) => resolve(resp.credential),
      });
      window.google.accounts.id.prompt((notification) => {
        if (notification.isNotDisplayed && (notification.isNotDisplayed() || notification.isSkippedMoment())) {
          reject({ code: 'cancelled' });
        }
      });
    });
  }

  // ---------- Auth handlers ----------
  async function handleAuthSubmit() {
    const em = email.trim();
    const pw = password;
    setAuthError(''); setAuthErrorOk(false);
    if (!em || !pw) { setAuthError('Please enter both email and password.'); return; }
    setAuthBusy(true);
    try {
      if (isSignUpMode) await createUserWithEmailAndPassword(auth, em, pw);
      else await signInWithEmailAndPassword(auth, em, pw);
    } catch (err) {
      setAuthError(friendlyAuthError(err.code));
    } finally {
      setAuthBusy(false);
    }
  }

  async function handleForgotPassword() {
    const em = email.trim();
    setAuthError(''); setAuthErrorOk(false);
    if (!em) { setAuthError('Enter your email above first, then tap "Forgot password?"'); return; }
    try {
      await sendPasswordResetEmail(auth, em);
      setAuthErrorOk(true);
      setAuthError('Password reset email sent. Check your inbox.');
    } catch (err) {
      setAuthErrorOk(false);
      setAuthError(friendlyAuthError(err.code));
    }
  }

  async function handleSignOut() {
    if (!confirm('Sign out of Your Companion?')) return;
    await signOut(auth);
  }

  async function reauthenticate() {
    const providerId = userRef.current.providerData[0] && userRef.current.providerData[0].providerId;
    if (providerId === 'google.com') {
      const idToken = await requestGisCredential();
      const cred = GoogleAuthProvider.credential(idToken);
      await reauthenticateWithCredential(userRef.current, cred);
    } else {
      const pwd = prompt('For security, please re-enter your password to confirm:');
      if (!pwd) throw { code: 'cancelled' };
      const cred = EmailAuthProvider.credential(userRef.current.email, pwd);
      await reauthenticateWithCredential(userRef.current, cred);
    }
  }

  async function handleDeleteAccount() {
    if (!userRef.current) return;
    if (!confirm('This permanently deletes your account and all conversation history. This cannot be undone. Continue?')) return;
    const uid = userRef.current.uid;
    try {
      await deleteDoc(doc(db, 'conversations', uid));
      await deleteUser(userRef.current);
      setAccountOpen(false);
    } catch (err) {
      if (err.code === 'auth/requires-recent-login') {
        try {
          await reauthenticate();
          await deleteDoc(doc(db, 'conversations', uid));
          await deleteUser(userRef.current);
          setAccountOpen(false);
        } catch (err2) {
          if (err2.code !== 'cancelled') alert('Could not delete account: ' + (friendlyAuthError(err2.code) || err2.message));
        }
      } else {
        alert('Could not delete account: ' + (friendlyAuthError(err.code) || err.message));
      }
    }
  }

  // ---------- Sending messages ----------
  async function sendMessage() {
    const now = Date.now();
    if (now - lastSendTsRef.current < MIN_SEND_INTERVAL_MS) return;
    const text = inputValue.trim().slice(0, MAX_INPUT_CHARS);
    if (!text || !wllamaRef.current || !modelReadyRef.current || !userRef.current) return;
    lastSendTsRef.current = now;

    setInputValue('');
    historyRef.current.push({ role: 'user', content: text });
    refreshMessagesView();
    setSending(true);
    setStreamingBotText('...');

    try {
      const contextMessages = buildContextForModel();
      const lastMsg = historyRef.current[historyRef.current.length - 1];
      if (!contextMessages.includes(lastMsg)) contextMessages.push(lastMsg);
      const prompt = await wllamaRef.current.formatChat(contextMessages, true);
      let reply = '';
      await wllamaRef.current.createCompletion(prompt, {
        nPredict: 300,
        sampling: { temp: 0.8 },
        onNewToken: (t, p, currentText) => {
          reply = currentText;
          setStreamingBotText(currentText);
        }
      });
      historyRef.current.push({ role: 'assistant', content: reply || '(empty response)' });
      await maybeSummarizeOldMessages();
      refreshMessagesView();
      setStreamingBotText(null);
      await saveMemory(userRef.current.uid);
    } catch (err) {
      setStreamingBotText('Error generating a reply: ' + err.message);
    } finally {
      setSending(false);
    }
  }

  function handleInputKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ---------- Render ----------
  if (screen === 'auth') {
    return h('div', { id: 'authScreen' },
      h('div', { id: 'authTitle' }, 'Your Companion'),
      h('div', { id: 'authSubtitle' }, isSignUpMode
        ? 'Create an account to save your companion across devices.'
        : 'Sign in to continue your conversations across devices.'),
      h('input', {
        type: 'email', placeholder: 'Email', autoComplete: 'email', maxLength: 254,
        value: email, onChange: (e) => setEmail(e.target.value)
      }),
      h('input', {
        type: 'password', placeholder: 'Password', autoComplete: 'current-password', maxLength: 128,
        value: password, onChange: (e) => setPassword(e.target.value)
      }),
      h('div', { id: 'authError', style: { color: authErrorOk ? '#4ade80' : '#f87171' } }, authError),
      h('button', { id: 'authSubmit', disabled: authBusy, onClick: handleAuthSubmit },
        isSignUpMode ? 'Create Account' : 'Sign In'),
      h('div', { id: 'orDivider' }, 'or'),
      h('div', { id: 'googleBtnHost', ref: googleBtnHostRef }),
      h('div', {
        id: 'authToggle',
        onClick: () => { setIsSignUpMode(!isSignUpMode); setAuthError(''); setAuthErrorOk(false); }
      }, isSignUpMode ? 'Already have an account? ' : "Don't have an account? ",
         h('span', null, isSignUpMode ? 'Sign in' : 'Sign up')),
      h('div', { id: 'forgotPassword', onClick: handleForgotPassword }, 'Forgot password?'),
      h('div', { id: 'tosNote' }, 'By continuing you agree to our ',
        h('a', { href: 'TOS.md' }, 'Terms'), ' & ',
        h('a', { href: 'PRIVACY.md' }, 'Privacy Policy'), '.')
    );
  }

  const displayItems = [];
  for (const m of messages) {
    if (m.role === 'user') displayItems.push({ cls: 'user', text: m.content, key: 'u' + m._k });
    else if (m.role === 'assistant') displayItems.push({ cls: 'bot', text: m.content, key: 'a' + m._k });
  }
  if (welcomeNotice) displayItems.push({ cls: 'sys', text: welcomeNotice, key: 'welcome' });
  if (streamingBotText !== null) displayItems.push({ cls: 'bot', text: streamingBotText, key: 'streaming' });

  return h('div', { id: 'chatScreen' },
    h('div', { id: 'header' },
      h('div', null,
        h('div', { id: 'headerTitle' }, 'Your Companion'),
        h('div', { id: 'status' }, statusText),
        syncWarningVisible && h('div', { id: 'syncWarning' }, '⚠ Last message may not have synced. Check your connection.'),
        loadBarVisible && h('div', { id: 'loadBar' }, h('div', { id: 'loadFill', style: { width: loadPct + '%' } })),
        retryVisible && h('button', { id: 'retryBtn', onClick: () => initModel(1) }, 'Retry loading')
      ),
      h('div', { id: 'headerBtns' },
        h('button', { id: 'accountBtn', onClick: () => setAccountOpen(true) }, 'Account'),
        h('button', { id: 'signOutBtn', onClick: handleSignOut }, 'Sign out')
      )
    ),
    h('div', { id: 'chat', ref: chatScrollRef },
      displayItems.map(item => h('div', { className: 'msg ' + item.cls, key: item.key }, item.text))
    ),
    h('div', { id: 'inputBar' },
      h('textarea', {
        id: 'userInput', rows: 1,
        placeholder: modelReadyRef.current ? 'Say something...' : 'Loading...',
        disabled: !modelReadyRef.current || sending,
        maxLength: MAX_INPUT_CHARS,
        value: inputValue,
        onChange: (e) => setInputValue(e.target.value),
        onKeyDown: handleInputKeyDown
      }),
      h('button', { id: 'sendBtn', disabled: !modelReadyRef.current || sending, onClick: sendMessage }, '➤')
    ),
    accountOpen && h('div', {
      id: 'accountModal',
      onClick: (e) => { if (e.target.id === 'accountModal') setAccountOpen(false); }
    },
      h('div', { id: 'accountSheet' },
        h('h3', null, 'Account'),
        h('p', null, userRef.current ? ('Signed in as ' + userRef.current.email) : ''),
        h('button', { className: 'sheetBtn', id: 'deleteAccountBtn', onClick: handleDeleteAccount }, 'Delete my account & data'),
        h('p', null, 'This permanently deletes your conversation history and sign-in — it cannot be undone.'),
        h('button', { id: 'closeSheetBtn', onClick: () => setAccountOpen(false) }, 'Close')
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
