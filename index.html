<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Roboto, sans-serif;
    background: #0d0f14;
    color: #eee;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 12px;
    background: #14161c;
    border-bottom: 1px solid #23262e;
    flex-shrink: 0;
  }
  #headerTitle { font-weight: 700; font-size: 17px; }
  #status { font-size: 12.5px; color: #7d8290; margin-top: 6px; }
  #loadBar {
    height: 4px; background: #23262e; border-radius: 2px;
    margin-top: 8px; overflow: hidden; display: block;
  }
  #loadFill { height: 100%; width: 0%; background: #3b6fed; transition: width 0.2s; }
  #chat {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 82%; padding: 11px 15px; border-radius: 16px;
    line-height: 1.45; white-space: pre-wrap; font-size: 15.5px; word-wrap: break-word;
  }
  .user { align-self: flex-end; background: #3b6fed; color: white; border-bottom-right-radius: 5px; }
  .bot { align-self: flex-start; background: #1e222b; border-bottom-left-radius: 5px; }
  .sys { align-self: center; color: #7d8290; font-size: 13px; text-align: center; max-width: 90%; }
  #inputBar {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    background: #14161c; border-top: 1px solid #23262e; flex-shrink: 0;
  }
  #userInput {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: none;
    background: #1c1f27; color: white; font-size: 15.5px; resize: none;
    max-height: 100px; font-family: inherit;
  }
  #userInput:disabled { opacity: 0.5; }
  #sendBtn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #3b6fed; color: white; font-size: 18px; flex-shrink: 0;
  }
  #sendBtn:disabled { background: #2a2d36; }
</style>
</head>
<body>
  <div id="header">
    <div id="headerTitle">Your Companion</div>
    <div id="status">Checking for WebGPU support...</div>
    <div id="loadBar"><div id="loadFill"></div></div>
  </div>
  <div id="chat"></div>
  <div id="inputBar">
    <textarea id="userInput" placeholder="Loading..." rows="1" disabled></textarea>
    <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
  </div>

<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const loadFill = document.getElementById('loadFill');

const MODEL_ID = "Qwen2.5-1.5B-Instruct-q4f16_1-MLC";
const SYSTEM_PROMPT = "You are a warm, witty, emotionally supportive companion. Talk like a real friend - casual, caring, a bit playful. Keep responses conversational length, not essays.";

let engine;
let history = [{ role: "system", content: SYSTEM_PROMPT }];

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function init() {
  if (!navigator.gpu) {
    statusEl.textContent = "WebGPU isn't available on this browser/device.";
    addMessage("This device or browser doesn't support WebGPU. Try the latest Chrome, and make sure it's up to date. Falling back isn't automatic in this version.", 'sys');
    return;
  }

  try {
    engine = await CreateMLCEngine(MODEL_ID, {
      initProgressCallback: (report) => {
        const pct = Math.round((report.progress || 0) * 100);
        loadFill.style.width = pct + '%';
        statusEl.textContent = report.text || `Loading... ${pct}%`;
      }
    });
    statusEl.textContent = 'Ready \u2014 accelerated by your device GPU.';
    document.getElementById('loadBar').style.display = 'none';
    inputEl.disabled = false;
    sendBtn.disabled = false;
    inputEl.placeholder = 'Say something...';
    addMessage('Model loaded with GPU acceleration. This conversation stays on your device.', 'sys');
  } catch (err) {
    statusEl.textContent = 'Failed to load: ' + err.message;
    addMessage('Something went wrong loading the model: ' + err.message, 'sys');
  }
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

window.sendMessage = async function () {
  const text = inputEl.value.trim();
  if (!text || !engine) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMessage(text, 'user');
  history.push({ role: 'user', content: text });

  sendBtn.disabled = true;
  inputEl.disabled = true;
  const botDiv = addMessage('...', 'bot');

  try {
    const stream = await engine.chat.completions.create({
      messages: history,
      temperature: 0.8,
      max_tokens: 300,
      stream: true,
    });

    let reply = '';
    for await (const chunk of stream) {
      const delta = chunk.choices[0]?.delta?.content || '';
      reply += delta;
      botDiv.textContent = reply;
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    botDiv.textContent = 'Error generating a reply: ' + err.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.disabled = false;
    chatEl.scrollTop = chatEl.scrollHeight;
  }
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

init();
</script>
</body>
</html>
